name: CI Tests

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x86-64
          - runner: windows-latest
            os: windows
            arch: x86-64
          - runner: macos-15-intel
            os: macos
            arch: x86-64
          - runner: macos-15
            os: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'windows' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk xvfb

      - name: Install system dependencies (macOS)
        if: ${{ matrix.os == 'macos' }}
        run: |
          brew update
          brew install tcl-tk
          python3.12 -c "import tkinter; print(f'Tk {tkinter.TkVersion} available')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run all tests (Linux)
        if: ${{ matrix.os == 'linux' }}
        run: |
          xvfb-run -a pytest tests/ -v --junitxml=test-results-${{ matrix.runner }}-${{ matrix.arch }}.xml

      - name: Run all tests (macOS/Windows)
        if: ${{ matrix.os != 'linux' }}
        run: |
          pytest tests/ -v --junitxml=test-results-${{ matrix.runner }}-${{ matrix.arch }}.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.runner }}-${{ matrix.arch }}
          retention-days: 14
          path: test-results-${{ matrix.runner }}-${{ matrix.arch }}.xml
