name: Build Executable

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ubuntu:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set VERSION_NUMBER
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            printf '%s\n' "VERSION_NUMBER=$REF_NAME" >> $GITHUB_ENV
          else
            printf '%s\n' "VERSION_NUMBER=dev-${GITHUB_SHA:0:7}" >> $GITHUB_ENV
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk

      - name: Locate Python and pip
        run: |
          echo "Python path: $(which python3.12)"                                                                                                                                                                                
          echo "Pip path: $(python3.12 -m site --user-site)"        

      - name: Install dependencies and Build executable on Ubuntu
        run: |
          python3.12 -m venv venv  
          python3.12 -m pip install --upgrade pip
          source venv/bin/activate     
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2
          
          scriptPath="${{ github.workspace }}/blocknet_aio_monitor.py"

          cmd=(pyinstaller --noconfirm --onefile \
            --hidden-import='PIL._tkinter_finder' \
            --add-data "theme:theme" \
            --add-data "img:img" \
            --clean \
            "$scriptPath")

          echo "Running command:"
          printf ' %q' "${cmd[@]}"
          echo

          "${cmd[@]}"
          mv dist/blocknet_aio_monitor dist/blocknet_aio_monitor-${{ env.VERSION_NUMBER }}-x86-64-linux

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          retention-days: 14
          path: |
            dist/blocknet_aio_monitor-*

  build-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86-64
            artifact: artifacts-macos-x86-64
          - runner: macos-15
            arch: arm64
            artifact: artifacts-macos-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set VERSION_NUMBER
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            printf '%s\n' "VERSION_NUMBER=$REF_NAME" >> $GITHUB_ENV
          else
            printf '%s\n' "VERSION_NUMBER=dev-${GITHUB_SHA:0:7}" >> $GITHUB_ENV
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk dependencies
        run: |
          brew update
          brew install tcl-tk
          python3.12 -c "import tkinter; print(f'Tk {tkinter.TkVersion} available')"

      - name: Install dependencies / Build executable on macOS
        run: |
          python3.12 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2
          
          scriptPath="${{ github.workspace }}/blocknet_aio_monitor.py"
          
          cmd=(pyinstaller --noconfirm --onefile \
          --add-data "theme:theme" \
          --add-data "img:img" \
          --clean \
          "$scriptPath")
          
          echo "Running command:"
          printf ' %q' "${cmd[@]}"
          echo
          
          "${cmd[@]}"
          
          mkdir -p my_bin
          mv dist/blocknet_aio_monitor my_bin/blocknet_aio_monitor

      - name: Create DMG file
        run: |
          mkdir -p dmg
          hdiutil create -volname "Blocknet AIO Monitor" -format UDRW -ov -srcfolder my_bin -o dmg/blocknet_aio_monitor-macos-base.dmg
          hdiutil convert dmg/blocknet_aio_monitor-macos-base.dmg -format UDZO -o dmg/blocknet_aio_monitor-${{ env.VERSION_NUMBER }}-${{ matrix.arch }}-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          path: |
            dmg/blocknet_aio_monitor-${{ env.VERSION_NUMBER }}-${{ matrix.arch }}-macos.dmg

  build-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set VERSION_NUMBER
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $VERSION_NUMBER = $env:GITHUB_REF_NAME
            Write-Host "Extracted tag: $VERSION_NUMBER"
          } else {
            $VERSION_NUMBER = "dev-$($env:GITHUB_SHA.Substring(0,7))"
            Write-Host "Non-tag build, using $VERSION_NUMBER"
          }
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $env:GITHUB_ENV

      - name: Debug VERSION_NUMBER
        run: |
          Write-Host "DEBUG: VERSION_NUMBER = $env:VERSION_NUMBER"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate Python and pip
        run: |
          $pythonPath = (Get-Command python).Path                                                                                                                                                                                         
          $pipPath = (Get-Command pip).Path                                                                                                                                                                                               
          Write-Host "Python path: $pythonPath"                                                                                                                                                                                           
          Write-Host "Pip path: $pipPath"     

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv venv
          venv\Scripts\activate.bat 
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      - name: Build executable on Windows
        run: |
          $scriptPath = "$env:GITHUB_WORKSPACE\blocknet_aio_monitor.py"
          $args = @("--noconfirm", "--onefile", "--log-level=DEBUG", "--add-data", "theme;theme", "--add-data", "img;img", "--clean", $scriptPath)
          Write-Host "Running: pyinstaller $($args -join ' ')"
          & pyinstaller @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Rename executable
        run: |
          $newName = "${{ github.workspace }}/dist/blocknet_aio_monitor-$env:VERSION_NUMBER-x86-64-windows.exe"
          Write-Host "DEBUG: New filename = $newName"
          Rename-Item -Path "${{ github.workspace }}/dist/blocknet_aio_monitor.exe" -NewName $newName
          Write-Host "DEBUG: Rename command executed successfully"


      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-win
          retention-days: 14
          path: |
            dist/blocknet_aio_monitor-${{ env.VERSION_NUMBER }}-x86-64-windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-ubuntu, build-macos, build-windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: false

      - name: Display downloaded artifacts
        run: |
          ls -R ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: blocknet_aio_monitor ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            ./artifacts/**/*
