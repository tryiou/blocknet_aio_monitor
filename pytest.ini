[tool:pytest]
# Test configuration for Blocknet AIO Monitor
minversion = 7.0
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
testpaths = 
    tests/unit
    tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: marks tests as integration tests
    network: marks tests that require network access
    gui: marks tests that interact with GUI components
    filesystem: marks tests that perform file operations
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
